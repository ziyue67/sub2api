<!DOCTYPE html>

  <title>模型广场 - 10 模型交互预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            dark: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .config-panel {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-8px);
      transition: max-height 400ms ease-out, opacity 400ms ease-out, transform 400ms ease-out;
    }
    .config-panel.open {
      max-height: 1200px;
      opacity: 1;
      transform: translateY(0);
    }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.15); }
    mark { background-color: rgba(250, 204, 21, 0.9); color: #111827; border-radius: 2px; padding: 0 2px; }
    .dark mark { background-color: rgba(250, 204, 21, 0.9); color: #111827; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#050810] text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-300">
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-40 -left-40 h-[700px] w-[700px] rounded-full bg-indigo-500/10 dark:bg-indigo-500/15 blur-[140px]"></div>
    <div class="absolute top-1/4 -right-40 h-[600px] w-[600px] rounded-full bg-purple-500/10 dark:bg-purple-500/12 blur-[130px]"></div>
    <div class="absolute bottom-0 left-1/3 h-[500px] w-[500px] rounded-full bg-cyan-500/8 dark:bg-cyan-500/10 blur-[110px]"></div>
    <div class="absolute inset-0 bg-[linear-gradient(rgba(0,0,0,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(0,0,0,0.03)_1px,transparent_1px)] dark:bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:48px_48px] opacity-40"></div>
  </div>

  <div class="relative z-10 mx-auto w-full max-w-[1600px] px-4 py-10 sm:px-6 lg:px-8">
    <div class="mb-8 flex flex-col gap-5 lg:flex-row lg:items-end lg:justify-between">
      <div class="max-w-2xl">
        <div class="mb-3 inline-flex items-center gap-2 rounded-full border border-indigo-500/20 bg-indigo-500/5 px-3 py-1 text-[10px] font-black uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-300">
          <span class="h-1.5 w-1.5 rounded-full bg-indigo-500 dark:bg-indigo-400 animate-pulse"></span>
          Model Square
        </div>
        <h1 class="text-4xl font-black tracking-tight bg-gradient-to-r from-gray-900 via-gray-800 to-gray-600 bg-clip-text text-transparent dark:from-white dark:via-gray-100 dark:to-gray-400">
          模型广场
        </h1>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400 leading-relaxed">汇聚所有可用模型、渠道与分组定价，一键对比并快速选择最优接入方案。</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative group flex-1 lg:flex-none">
          <div class="absolute inset-0 rounded-2xl bg-gradient-to-r from-indigo-500/20 to-purple-500/20 opacity-0 group-focus-within:opacity-100 transition-opacity duration-300 blur-xl"></div>
          <div class="relative flex items-center">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-500 group-focus-within:text-indigo-500 dark:group-focus-within:text-indigo-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            <input id="search" type="text" placeholder="搜索模型、渠道、平台或分组..." class="w-full lg:w-96 h-12 bg-white/80 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-2xl py-2 pl-11 pr-4 text-sm font-medium text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 outline-none focus:border-indigo-500/50 focus:bg-white dark:focus:bg-white/10 transition-all shadow-lg shadow-black/5 dark:shadow-black/20 backdrop-blur" />
          </div>
        </div>
        <button id="themeToggle" type="button" class="flex h-12 w-12 items-center justify-center rounded-2xl bg-white/80 dark:bg-white/5 border border-gray-200 dark:border-white/10 hover:bg-white dark:hover:bg-white/10 transition-all shadow-lg shadow-black/5 dark:shadow-black/20 active:scale-95 backdrop-blur" aria-label="切换主题">
          <svg id="themeIcon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
        </button>
        <button type="button" class="flex h-12 w-12 items-center justify-center rounded-2xl bg-white/80 dark:bg-white/5 border border-gray-200 dark:border-white/10 hover:bg-white dark:hover:bg-white/10 transition-all shadow-lg shadow-black/5 dark:shadow-black/20 active:scale-95 backdrop-blur" onclick="location.reload()" aria-label="刷新">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
        </button>
      </div>
    </div>

    <div class="flex flex-wrap gap-2.5 mb-8 px-1" id="platformFilter"></div>

    <div class="mb-8 mx-1 inline-flex items-center gap-3 rounded-2xl bg-amber-500/10 px-5 py-3.5 text-xs font-semibold text-amber-700 dark:text-amber-300 border border-amber-500/20 shadow-lg shadow-amber-500/5 backdrop-blur">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      <span>提示：下方价格为渠道基础价，实际扣费按所选分组倍率计算；专属倍率和高峰倍率会直接显示在分组标签中。</span>
    </div>

    <div id="loading" class="py-32 text-center">
      <div class="inline-block h-10 w-10 animate-spin rounded-full border-4 border-indigo-500/20 border-t-indigo-500 dark:border-t-indigo-400"></div>
    </div>

    <div id="content" class="hidden grid grid-cols-1 lg:grid-cols-[300px_1fr] gap-8 items-start">
      <aside id="indexAside" tabindex="0" class="hidden lg:flex sticky top-8 h-fit max-h-[calc(100vh-4rem)] w-full flex-col overflow-hidden rounded-3xl border border-gray-200 dark:border-white/10 bg-white/80 dark:bg-white/5 backdrop-blur-xl shadow-2xl shadow-black/10 dark:shadow-black/20 focus:outline-none focus:ring-2 focus:ring-indigo-500/30">
        <div class="px-5 py-4 border-b border-gray-200 dark:border-white/10">
          <h2 class="text-xs font-black uppercase tracking-[0.25em] text-gray-500 dark:text-gray-400">模型索引</h2>
          <p class="mt-1 text-xs text-gray-600 dark:text-gray-400">↑↓ 选择 · Enter 跳转 · 共 10 个</p>
        </div>
        <div id="indexList" class="overflow-y-auto p-2.5 space-y-1 no-scrollbar"></div>
      </aside>
      <div id="cardsContainer" class="space-y-8"></div>
    </div>

    <div id="empty" class="hidden py-32 text-center">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-3xl bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10">
        <svg class="h-6 w-6 text-gray-400 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </div>
      <p class="text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest">没有可展示的模型</p>
      <p class="mt-2 text-xs text-gray-400 dark:text-gray-500">尝试调整搜索或平台筛选</p>
    </div>
  </div>

  <script>
    const models = [
      { key: 'openai:gpt-4o', name: 'gpt-4o', platform: 'openai', channels: [
        { name: 'OpenAI 官方渠道', key: 'channel:1', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 1.0 } }] },
        { name: 'Azure 中转渠道', key: 'channel:2', entries: [{ group: { name: 'VIP 分组', id: 2, rate_multiplier: 0.8 } }] }
      ]},
      { key: 'openai:gpt-4o-mini', name: 'gpt-4o-mini', platform: 'openai', channels: [
        { name: 'OpenAI 官方渠道', key: 'channel:1', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 0.5 } }] }
      ]},
      { key: 'anthropic:claude-3-5-sonnet', name: 'claude-3-5-sonnet', platform: 'anthropic', channels: [
        { name: 'Anthropic 官方', key: 'channel:3', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 1.2 } }] }
      ]},
      { key: 'anthropic:claude-3-opus', name: 'claude-3-opus', platform: 'anthropic', channels: [
        { name: 'Anthropic 官方', key: 'channel:3', entries: [{ group: { name: '高级分组', id: 3, rate_multiplier: 2.0 } }] }
      ]},
      { key: 'gemini:gemini-1.5-pro', name: 'gemini-1.5-pro', platform: 'gemini', channels: [
        { name: 'Google AI', key: 'channel:4', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 0.9 } }] }
      ]},
      { key: 'gemini:gemini-1.5-flash', name: 'gemini-1.5-flash', platform: 'gemini', channels: [
        { name: 'Google AI', key: 'channel:4', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 0.4 } }] }
      ]},
      { key: 'meta:llama-3-70b', name: 'llama-3-70b', platform: 'meta', channels: [
        { name: 'Meta 渠道', key: 'channel:5', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 0.7 } }] }
      ]},
      { key: 'mistral:mistral-large', name: 'mistral-large', platform: 'mistral', channels: [
        { name: 'Mistral AI', key: 'channel:6', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 1.1 } }] }
      ]},
      { key: 'cohere:command-r-plus', name: 'command-r-plus', platform: 'cohere', channels: [
        { name: 'Cohere', key: 'channel:7', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 0.6 } }] }
      ]},
      { key: 'alibaba:qwen-2-72b', name: 'qwen-2-72b', platform: 'alibaba', channels: [
        { name: '阿里云百炼', key: 'channel:8', entries: [{ group: { name: '默认分组', id: 1, rate_multiplier: 0.5 } }] }
      ]}
    ];

    const platformMeta = {
      openai: { label: 'OpenAI', gradient: 'from-emerald-500 to-emerald-600', light: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-300 border-emerald-500/30', dot: 'bg-emerald-500' },
      anthropic: { label: 'Anthropic', gradient: 'from-orange-500 to-orange-600', light: 'bg-orange-500/10 text-orange-600 dark:text-orange-300 border-orange-500/30', dot: 'bg-orange-500' },
      gemini: { label: 'Gemini', gradient: 'from-blue-500 to-blue-600', light: 'bg-blue-500/10 text-blue-600 dark:text-blue-300 border-blue-500/30', dot: 'bg-blue-500' },
      meta: { label: 'Meta', gradient: 'from-sky-500 to-sky-600', light: 'bg-sky-500/10 text-sky-600 dark:text-sky-300 border-sky-500/30', dot: 'bg-sky-500' },
      mistral: { label: 'Mistral', gradient: 'from-violet-500 to-violet-600', light: 'bg-violet-500/10 text-violet-600 dark:text-violet-300 border-violet-500/30', dot: 'bg-violet-500' },
      cohere: { label: 'Cohere', gradient: 'from-rose-500 to-rose-600', light: 'bg-rose-500/10 text-rose-600 dark:text-rose-300 border-rose-500/30', dot: 'bg-rose-500' },
      alibaba: { label: 'Alibaba', gradient: 'from-amber-500 to-amber-600', light: 'bg-amber-500/10 text-amber-600 dark:text-amber-300 border-amber-500/30', dot: 'bg-amber-500' }
    };

    let activeKey = null;
    let selectedIndex = 0;
    let currentPlatform = 'all';
    let searchQuery = '';

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    }

    function highlight(name, query) {
      if (!query) return escapeHtml(name);
      const idx = name.toLowerCase().indexOf(query.toLowerCase());
      if (idx === -1) return escapeHtml(name);
      const before = escapeHtml(name.slice(0, idx));
      const match = escapeHtml(name.slice(idx, idx + query.length));
      const after = escapeHtml(name.slice(idx + query.length));
      return `${before}<mark>${match}</mark>${after}`;
    }

    function filteredModels() {
      const q = searchQuery.trim().toLowerCase();
      return models.filter(m => {
        if (currentPlatform !== 'all' && m.platform !== currentPlatform) return false;
        if (!q) return true;
        return [m.name, m.platform, m.channels.map(c => c.name).join(' ')].join(' ').toLowerCase().includes(q);
      });
    }

    function platforms() {
      return ['all', ...new Set(models.map(m => m.platform)).values()];
    }

    function renderPlatformFilter() {
      const container = document.getElementById('platformFilter');
      container.innerHTML = platforms().map(p => {
        const active = currentPlatform === p;
        const meta = platformMeta[p];
        const label = p === 'all' ? '全部平台' : meta.label;
        const cls = active
          ? 'relative text-white shadow-lg shadow-indigo-500/20'
          : (p === 'all' ? 'bg-gray-200/80 dark:bg-white/5 text-gray-600 dark:text-gray-400 border border-gray-300 dark:border-white/10 hover:border-gray-400 dark:hover:border-white/20' : meta.light + ' border border-gray-300 dark:border-white/10 hover:border-gray-400 dark:hover:border-white/20');
        return `<button type="button" data-platform="${p}" class="group relative px-5 py-2.5 rounded-2xl text-xs font-bold transition-all active:scale-95 backdrop-blur ${cls}">${active ? '<span class="absolute inset-0 rounded-2xl bg-gradient-to-r from-indigo-500 to-purple-500 opacity-80 blur-md -z-10"></span>' : ''}${label}</button>`;
      }).join('');
      container.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => { currentPlatform = btn.dataset.platform; renderAll(); });
      });
    }

    function renderIndex(list) {
      const container = document.getElementById('indexList');
      if (list.length === 0) {
        container.innerHTML = `<p class="px-4 py-8 text-center text-xs text-gray-500 dark:text-gray-400">没有匹配的模型</p>`;
        return;
      }
      const grouped = {};
      list.forEach((m, i) => {
        if (!grouped[m.platform]) grouped[m.platform] = [];
        grouped[m.platform].push({ model: m, index: i });
      });
      container.innerHTML = Object.entries(grouped).map(([platform, items]) => `
        <div class="px-3 pt-3 pb-1.5 text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400">${platformMeta[platform].label}</div>
        ${items.map(item => {
          const active = activeKey === item.model.key;
          return `<button type="button" data-index="${item.index}" data-key="${item.model.key}" class="w-full text-left rounded-2xl px-3.5 py-3 text-sm font-semibold transition-all duration-200 group ${active ? 'bg-gradient-to-r from-indigo-500/20 to-purple-500/20 text-indigo-900 dark:text-white shadow-lg shadow-indigo-500/10 border border-indigo-500/30' : 'text-gray-600 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/5 border border-transparent'}">
            <span class="flex items-center gap-2.5">
              <span class="h-1.5 w-1.5 rounded-full shrink-0 ${platformMeta[platform].dot} ring-2 ring-black/10 dark:ring-white/20"></span>
              <span class="block truncate">${highlight(item.model.name, searchQuery)}</span>
            </span>
            <span class="mt-1 block text-xs font-mono uppercase tracking-wider opacity-50">${item.model.channels.length} 渠道</span>
          </button>`;
        }).join('')}
      `).join('');
      container.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedIndex = parseInt(btn.dataset.index);
          selectModel(btn.dataset.key);
        });
      });
    }

    function renderCards(list) {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = list.map(m => {
        const meta = platformMeta[m.platform];
        return `
        <article id="model-${m.key}" data-model-key="${m.key}" class="scroll-mt-8 relative bg-white/80 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-3xl shadow-2xl shadow-black/10 dark:shadow-black/20 card-hover transition-all duration-500 overflow-hidden backdrop-blur-xl group">
          <div class="h-1.5 w-full bg-gradient-to-r ${meta.gradient}"></div>
          <header class="px-7 py-5 flex items-start justify-between border-b border-gray-200 dark:border-white/10 bg-gray-50/50 dark:bg-white/3">
            <div class="min-w-0">
              <div class="flex items-center gap-3">
                <div class="h-11 w-11 rounded-2xl flex items-center justify-center text-xl font-black text-white shadow-lg bg-gradient-to-r ${meta.gradient}">${m.name.slice(0,1).toUpperCase()}</div>
                <div>
                  <h2 class="text-2xl font-black tracking-tight text-gray-900 dark:text-white truncate leading-tight">${highlight(m.name, searchQuery)}</h2>
                  <p class="mt-0.5 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest">${meta.label} · ${m.channels.length} 个渠道</p>
                </div>
              </div>
            </div>
            <button type="button" class="toggle-config shrink-0 inline-flex items-center gap-2 rounded-2xl border border-gray-200 dark:border-white/10 bg-white/80 dark:bg-white/5 px-4 py-2.5 text-sm font-bold text-gray-700 dark:text-gray-300 hover:border-indigo-500/50 hover:text-indigo-600 dark:hover:text-indigo-300 hover:bg-indigo-500/10 transition-all shadow-sm">
              <svg class="arrow h-4 w-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
              <span>查看配置</span>
            </button>
          </header>
          <div class="divide-y divide-gray-200 dark:divide-white/10">
            ${m.channels.map(ch => `
              <div class="p-6">
                <div class="flex flex-col xl:flex-row xl:items-start gap-6">
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2.5">
                      <span class="text-xs font-black uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400">渠道</span>
                      <span class="text-base font-bold text-gray-900 dark:text-white">${ch.name}</span>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2">
                      ${ch.entries.map(e => `<span class="max-w-full min-w-0 rounded-xl px-3 py-1.5 text-xs font-bold bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-300">${e.group.name} · 倍率 ${e.group.rate_multiplier}</span>`).join('')}
                    </div>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-3">
                      <span class="text-xs font-black uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400">基础定价</span>
                      <span class="text-xs font-black uppercase tracking-widest text-indigo-600 dark:text-indigo-300 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20">Token 计费</span>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                      <div class="space-y-1"><span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">输入</span><span class="block text-base font-black font-mono text-gray-900 dark:text-white">$5.00/M</span></div>
                      <div class="space-y-1"><span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">输出</span><span class="block text-base font-black font-mono text-gray-900 dark:text-white">$15.00/M</span></div>
                      <div class="space-y-1"><span class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase">缓存</span><span class="block text-base font-black font-mono text-gray-900 dark:text-white">$1.25/M</span></div>
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="config-panel border-t border-gray-200 dark:border-white/10 bg-gray-50/50 dark:bg-black/20 px-7 py-6">
            <div class="mb-4 flex items-center gap-2">
              <span class="text-xs font-black uppercase tracking-[0.2em] text-gray-500 dark:text-gray-400">模型配置</span>
              <span class="font-mono text-xs font-bold text-indigo-600 dark:text-indigo-300 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20">${m.key}</span>
            </div>
            <div class="grid gap-3">
              ${m.channels.map(ch => `
                <div class="rounded-2xl border border-gray-200 dark:border-white/10 bg-white dark:bg-white/5 p-4 backdrop-blur">
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-base font-bold text-gray-900 dark:text-white">${ch.name}</span>
                    <span class="font-mono text-xs text-gray-500">${ch.key}</span>
                  </div>
                  <div class="space-y-2">
                    ${ch.entries.map(e => `<div class="flex items-center justify-between text-sm"><span class="font-medium text-gray-700 dark:text-gray-300">${e.group.name}</span><span class="font-mono text-xs text-gray-500">id=${e.group.id} · 倍率 ${e.group.rate_multiplier}</span></div>`).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </article>
      `;
      }).join('');

      container.querySelectorAll('.toggle-config').forEach(btn => {
        btn.addEventListener('click', () => {
          const panel = btn.closest('article').querySelector('.config-panel');
          const arrow = btn.querySelector('.arrow');
          const span = btn.querySelector('span');
          const open = panel.classList.toggle('open');
          arrow.classList.toggle('rotate-180', open);
          span.textContent = open ? '收起配置' : '查看配置';
        });
      });
    }

    function selectModel(key) {
      activeKey = key;
      const el = document.getElementById('model-' + key);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      renderAll();
    }

    function renderAll() {
      const list = filteredModels();
      document.getElementById('loading').classList.add('hidden');
      if (list.length === 0) {
        document.getElementById('content').classList.add('hidden');
        document.getElementById('empty').classList.remove('hidden');
      } else {
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('empty').classList.add('hidden');
        renderPlatformFilter();
        renderIndex(list);
        renderCards(list);
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderAll();
    });

    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const sunIcon = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
    const moonIcon = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';

    function applyTheme(dark) {
      if (dark) {
        document.documentElement.classList.add('dark');
        themeIcon.innerHTML = sunIcon;
        themeIcon.className = 'h-5 w-5 text-amber-500';
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.innerHTML = moonIcon;
        themeIcon.className = 'h-5 w-5 text-indigo-500';
      }
      localStorage.setItem('model-square-theme', dark ? 'dark' : 'light');
    }

    themeToggle.addEventListener('click', () => {
      applyTheme(!document.documentElement.classList.contains('dark'));
    });

    const savedTheme = localStorage.getItem('model-square-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

    const aside = document.getElementById('indexAside');
    aside.addEventListener('keydown', (e) => {
      const list = filteredModels();
      if (list.length === 0) return;
      if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const step = e.key === 'ArrowDown' ? 1 : -1;
        selectedIndex = (selectedIndex + step + list.length) % list.length;
        const btn = aside.querySelector(`[data-index="${selectedIndex}"]`);
        if (btn) { btn.focus(); btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
      } else if (e.key === 'Enter' && selectedIndex >= 0) {
        e.preventDefault();
        selectModel(list[selectedIndex].key);
      }
    });

    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting);
      if (visible.length > 0) {
        const top = visible.sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        const key = top.target.getAttribute('data-model-key');
        if (key && activeKey !== key) { activeKey = key; renderAll(); }
      }
    }, { rootMargin: '-10% 0px -60% 0px', threshold: 0 });

    setTimeout(() => {
      renderAll();
      document.querySelectorAll('[data-model-key]').forEach(el => observer.observe(el));
    }, 400);
  </script>
</body>
</html>
