# Insert into each Sub2API server {} including HTTP redirect listeners.
# Replace any access_log off at this level; a location-level off also overrides it.
access_log /var/log/nginx/sub2api-connections.jsonl sub2api_connections buffer=32k flush=1s if=$sub2api_connection_loggable;
# This is a server-generated edge ID; app response X-Request-ID is logged separately.
add_header X-Edge-Request-ID $request_id always;
