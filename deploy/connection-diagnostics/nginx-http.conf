# Include inside http {}. No query strings, headers, cookies or response bodies.
map $uri $sub2api_connection_path {
    ~^/(v1|openai/v1|backend-api/codex)/(responses(/compact)?|chat/completions|messages|models|embeddings|images/generations|images/edits|audio/transcriptions|audio/speech)$ $uri;
    ~^/(health|readyz)$ $uri;
    default /[redacted];
}
log_format sub2api_connections escape=json
    '{"source":"nginx","ts":"$msec","duration":"$request_time",'
    '"host":"$http_host","scheme":"$scheme","method":"$request_method",'
    '"path":"$sub2api_connection_path","client_ip":"$remote_addr",'
    '"proto":"$server_protocol","tls":"$ssl_protocol",'
    '"status":"$status","bytes":"$body_bytes_sent",'
    '"edge_id":"$request_id","request_id":"$upstream_http_x_request_id",'
    '"upstream_status":"$upstream_status","completion":"$request_completion"}';

map $uri $sub2api_connection_loggable {
    ~^/api/v1/admin/usage/connections 0;
    default 1;
}
