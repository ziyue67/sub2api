name: Priority observation regression
on:
  push:
    branches: [fix/priority-observation-identity]
  pull_request:
    paths:
      - 'backend/internal/service/priority*'
      - 'backend/internal/service/openai_account_scheduler.go'
      - 'backend/internal/handler/*observation*'
      - 'backend/internal/handler/priority_penalty_review_test.go'
      - 'backend/internal/service/openai_ws_forwarder_ingress.go'
      - '.github/scripts/priority-penalty-review-red.py'
      - 'backend/internal/handler/openai_gateway_handler.go'
      - 'backend/internal/handler/openai_chat_completions.go'
      - 'backend/internal/repository/priority_scheduling*'
      - 'frontend/src/views/admin/PrioritySchedulingView.vue'
      - 'frontend/src/views/admin/__tests__/PrioritySchedulingView.spec.ts'
      - '.github/workflows/priority-observation.yml'
      - '.github/scripts/priority-observation-red.py'
      - '.github/scripts/priority-observation-check-red.py'
      - 'backend/internal/handler/admin/priority_scheduling*'
      - 'frontend/src/api/admin/priorityScheduling.ts'
      - 'frontend/src/i18n/locales/*/priorityScheduling.ts'
concurrency:
  group: priority-observation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  seams:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Complete old production checkout must fail behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/priority-logs"
          cleanup_old_checkout() {
            if test -d "$RUNNER_TEMP/priority-old"; then
              git -C "$RUNNER_TEMP/priority-old" restore --source=00788a4705152cb90aab089d352a494531e4664b --staged --worktree -- .
              git -C "$RUNNER_TEMP/priority-old" diff --exit-code
              git -C "$RUNNER_TEMP/priority-old" diff --cached --exit-code
              git worktree remove --force "$RUNNER_TEMP/priority-old"
              echo "Restored immutable baseline source and removed isolated red checkout"
            fi
          }
          trap cleanup_old_checkout EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 .github/scripts/priority-observation-red.py
          set +e
          (cd "$RUNNER_TEMP/priority-old/backend" && go test -tags=unit ./internal/service ./internal/handler ./internal/handler/admin -run '^TestPriorityObservationBaseline' -count=1 -v -timeout=10m) > "$RUNNER_TEMP/priority-logs/red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/priority-logs/red.log"
          test "$result" -ne 0
          python3 .github/scripts/priority-observation-check-red.py "$RUNNER_TEMP/priority-logs/red.log"
      - name: Complete a426 review baseline must fail the three review regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/priority-logs"
          cleanup_review_checkout() {
            if test -d "$RUNNER_TEMP/priority-review-old"; then
              git -C "$RUNNER_TEMP/priority-review-old" restore --source=a426477ecc8cec1af43b0545467850ea5768a23d --staged --worktree -- .
              git -C "$RUNNER_TEMP/priority-review-old" diff --exit-code
              git worktree remove --force "$RUNNER_TEMP/priority-review-old"
              echo "Restored a426 baseline and removed review checkout"
            fi
          }
          trap cleanup_review_checkout EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 .github/scripts/priority-penalty-review-red.py
          set +e
          (cd "$RUNNER_TEMP/priority-review-old/backend" && go test -tags=unit ./internal/service ./internal/handler -run '^TestPriorityPenaltyReview(NativeLease|LateSelection|HandlerFailover)$' -count=1 -v -timeout=10m) > "$RUNNER_TEMP/priority-logs/review-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/priority-logs/review-red.log"
          test "$result" -ne 0
          python3 .github/scripts/priority-penalty-review-red.py "$RUNNER_TEMP/priority-logs/review-red.log"
      - name: New transport scheduler history and handler seams
        id: green
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -tags=unit ./internal/service ./internal/handler ./internal/handler/admin -run '^(TestPriority|TestOpenAI.*Sticky|Test.*PreviousResponse|TestOpenAI.*Profit|TestOpenAI.*RPM|TestOpenAI.*Replay|TestOpenAI.*Failover)'  -count=1 -v -timeout=15m) 2>&1 | tee "$RUNNER_TEMP/priority-logs/green.log"
      - name: Race check asynchronous history and observation seams
        if: ${{ !cancelled() && steps.green.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -race -tags=unit ./internal/service -run '^(TestPriorityObservation|TestPriorityLatencyModes|TestPriorityPenaltyReview|TestPriorityHistory|TestPrioritySignalRefresh)' -count=1 -v -timeout=8m) 2>&1 | tee "$RUNNER_TEMP/priority-logs/race.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: priority-seams-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/priority-logs
          if-no-files-found: error

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      CI: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: PostgreSQL persisted usage and quality scope regressions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/priority-logs"
          (cd backend && go test -tags=integration ./internal/repository -run '^(TestPriorityObservation|TestPriorityScheduling)' -count=1 -v -timeout=15m) 2>&1 | tee "$RUNNER_TEMP/priority-logs/persistence.log"
          grep -q -- '--- PASS: TestPriorityObservationPersistedPublicAliasAndGroup' "$RUNNER_TEMP/priority-logs/persistence.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: priority-persistence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/priority-logs
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Real page bounded refresh lifecycle
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/priority-logs"
          pnpm --dir frontend exec vitest run src/views/admin/__tests__/PrioritySchedulingView.spec.ts src/i18n/__tests__/localeKeyCompleteness.spec.ts --maxWorkers=1 --minWorkers=1 2>&1 | tee "$RUNNER_TEMP/priority-logs/ui.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: priority-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/priority-logs
