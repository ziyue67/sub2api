name: Restore GHCR Tags

# 从 Docker Hub 把指定版本的镜像复制回 GHCR，只打指定标签。
#
# 用途：GHCR 不支持"只删某个标签"——删除版本会连同该版本的全部标签一起删除。
#       先在网页上删除版本，再运行本工作流，即可恢复成干净的标签集合。
#       （源与目标内容一致：docker.io/ziyue67/sub2api:<version>）

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（默认 0.2.4）'
        required: true
        default: '0.2.4'
      tags:
        description: '要恢复的 GHCR 标签（逗号分隔）'
        required: true
        default: '0.2.4,0.2.4-amd64,latest'

permissions:
  contents: read
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy image with exact tags
        env:
          VERSION: ${{ inputs.version }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          SRC="ziyue67/sub2api:${VERSION}"
          ARGS=()
          for t in ${TAGS//,/ }; do
            [ -n "$t" ] && ARGS+=( -t "ghcr.io/ziyue67/sub2api:${t}" )
          done
          echo "源镜像: docker.io/${SRC}"
          echo "----- 源 manifest -----"
          docker buildx imagetools inspect "${SRC}" | head -24
          docker buildx imagetools create "${ARGS[@]}" "${SRC}"
          echo "----- 校验 GHCR 标签 -----"
          for t in ${TAGS//,/ }; do
            echo "== ghcr.io/ziyue67/sub2api:${t} =="
            docker buildx imagetools inspect "ghcr.io/ziyue67/sub2api:${t}" | sed -n '1,8p'
          done
