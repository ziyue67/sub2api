name: Probe DockerHub API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          user = os.environ["DH_USER"]
          token = os.environ["DH_TOKEN"]

          login = urllib.request.Request(
              "https://hub.docker.com/v2/users/login",
              data=json.dumps({"username": user, "password": token}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(login, timeout=30) as resp:
              jwt = json.loads(resp.read())["token"]

          def show(url, auth=True):
              req = urllib.request.Request(url)
              if auth:
                  req.add_header("Authorization", "JWT " + jwt)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", "replace")
                  print("URL:", url)
                  try:
                      data = json.loads(body)
                      if isinstance(data, dict) and "results" in data:
                          print("  count:", data.get("count"), "results:", len(data.get("results", [])))
                          print("  next:", data.get("next"))
                          for item in data.get("results", [])[:60]:
                              print("   -", item.get("name"), "|", item.get("last_updated"))
                      else:
                          print("  keys:", list(data)[:15] if isinstance(data, dict) else type(data))
                          print("  raw:", body[:400])
                  except Exception:
                      print("  raw(non-json):", body[:400])
              except Exception as exc:
                  print("URL:", url, "ERROR:", exc)

          show(f"https://hub.docker.com/v2/namespaces/{user}/repositories/sub2api/tags?page_size=100")
          show(f"https://hub.docker.com/v2/namespaces/{user}/repositories/sub2api/")
          show(f"https://hub.docker.com/v2/repositories/{user}/sub2api/")
          show(f"https://hub.docker.com/v2/repositories/{user}/sub2api/tags/?page=1&page_size=100&ordering=last_updated")
          PYEOF

      - name: Probe multi-arch manifests
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set +e
          # 验证多架构清单的可拉取性：--verbose 会拉取每个子平台 manifest，
          # 子镜像缺失时报错；同时用来确认 -arm64 标签的删除结果。
          # 已删除的 tag 会导致该次 inspect 失败，属预期，不终止后续检查。
          for img in ziyue67/sub2api:latest ziyue67/sub2api:0.2.4 ziyue67/sub2api:0.2.4-amd64 ziyue67/sub2api:0.2.4-arm64; do
            echo "===== manifest: $img ====="
            docker manifest inspect --verbose "$img" > /tmp/m.json 2>&1
            rc=$?
            echo "exit_code=$rc"
            grep -E '"architecture"|"os"|"mediaType"|no such manifest|manifest unknown|denied|unauthorized|Not Found' /tmp/m.json | head -16
          done
