name: Upstream channel operations exact head
on:
  pull_request:
    paths:
      - '**/upstream_operations*'
      - '**/UpstreamChannelOperations*'
      - '**/UpstreamAnalytics*'
      - '.github/workflows/upstream-channel-operations.yml'
      - '.github/scripts/upstream-channel-operations-screenshot.mjs'
      - 'frontend/src/api/admin/upstreamOperations.ts'
      - 'frontend/src/i18n/locales/*/upstreamOps.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: git rev-parse HEAD
      - name: OAuth and pinned-protocol attribution assertions RED against previous head
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          target=internal/service/upstream_operations.go
          cp "$target" "$RUNNER_TEMP/upstream-current-service.go"
          trap 'cp "$RUNNER_TEMP/upstream-current-service.go" "$target"' EXIT
          git fetch --no-tags --depth=1 origin ecf63af98587c151fe40893f3e3c322a777b17df
          git show ecf63af98587c151fe40893f3e3c322a777b17df:backend/internal/service/upstream_operations.go > "$target"
          set +e
          go test -tags=unit ./internal/service -run '^TestUpstreamOperations(ExcelOAuthCannotMasqueradeAsNativeCodex|PinnedResponsesPreservesExplicitRelayBase)$' -count=1 -v > "$RUNNER_TEMP/upstream-excel-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/upstream-excel-red.log"
          test "$result" -ne 0
          grep -q 'FAIL: TestUpstreamOperationsExcelOAuthCannotMasqueradeAsNativeCodex' "$RUNNER_TEMP/upstream-excel-red.log"
          grep -q 'Excel-only OAuth cannot be attributed to native Codex' "$RUNNER_TEMP/upstream-excel-red.log"
          grep -q 'FAIL: TestUpstreamOperationsPinnedResponsesPreservesExplicitRelayBase' "$RUNNER_TEMP/upstream-excel-red.log"
          grep -q 'pinned Responses must retain explicit relay base' "$RUNNER_TEMP/upstream-excel-red.log"
      - run: go test -tags=unit ./internal/service ./internal/handler/admin ./internal/server/routes -run '^TestUpstreamOperations' -count=1 -v
        working-directory: backend
      - run: go test -tags=integration ./internal/repository -run '^TestUpstreamOperations' -count=1 -v
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm exec vitest run src/views/admin/__tests__/UpstreamChannelOperationsView.spec.ts src/components/admin/operations/__tests__/SmartOpsNav.spec.ts src/components/layout/__tests__/AppSidebar.spec.ts --maxWorkers=1 --minWorkers=1 --no-file-parallelism
        working-directory: frontend
      - run: pnpm --dir frontend run build
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/upstream-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/upstream-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Upstream channel page with synthetic data and zero live requests
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/upstream-browser/node_modules/playwright
          UPSTREAM_SCREENSHOT_DIR: ${{ runner.temp }}/upstream-screenshots
        run: node .github/scripts/upstream-channel-operations-screenshot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upstream-channel-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/upstream-screenshots
          if-no-files-found: error
