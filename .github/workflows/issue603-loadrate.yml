name: Issue 603 load capacity regression

on:
  pull_request:
    branches: [production]
    paths:
      - 'backend/internal/service/account.go'
      - 'backend/internal/service/account_load_factor_test.go'
      - 'backend/internal/service/openai_account_scheduler.go'
      - 'backend/internal/service/openai_account_scheduler_test.go'
      - 'backend/internal/service/openai_gateway_scheduling.go'
      - 'backend/internal/service/gateway_scheduling.go'
      - 'backend/internal/service/ops_concurrency.go'
      - 'backend/internal/service/ops_metrics_collector.go'
      - 'backend/internal/repository/account_repo.go'
      - 'backend/internal/repository/account_repo_schedulable_projection_test.go'
      - 'backend/internal/handler/admin/account_handler.go'
      - '.github/workflows/issue603-loadrate.yml'
      - '.github/scripts/issue603-loadrate-check-red.py'

permissions:
  contents: read

concurrency:
  group: issue603-loadrate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      BASELINE: ec007920de042797299fc7cf2c034ad24c136462
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify exact source and baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git cat-file -e "$BASELINE^{commit}"
          printf 'exact_head=%s\nproduction_baseline=%s\n' "$SOURCE_HEAD" "$BASELINE"
      - name: RED - new scheduler behavior test against original production source
        shell: bash
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/issue603-red"
          git worktree add --detach "$old" "$BASELINE"
          trap 'git worktree remove --force "$old"' EXIT
          cp backend/internal/service/openai_account_scheduler_test.go "$old/backend/internal/service/"
          test "$(git -C "$old" hash-object backend/internal/service/openai_account_scheduler.go)" = "$(git rev-parse "$BASELINE:backend/internal/service/openai_account_scheduler.go")"
          set +e
          (cd "$old/backend" && go test -tags=unit ./internal/service -run '^TestBuildOpenAIAccountLoadRequestUsesRealConcurrency$' -count=1 -v -timeout=5m) > "$RUNNER_TEMP/issue603-red.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/issue603-red.log"
          test "$result" -ne 0
          python3 .github/scripts/issue603-loadrate-check-red.py "$RUNNER_TEMP/issue603-red.log"
          test "$(git -C "$old" hash-object backend/internal/service/openai_account_scheduler.go)" = "$(git rev-parse "$BASELINE:backend/internal/service/openai_account_scheduler.go")"
      - name: GREEN - behavior and repository projection regressions
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -tags=unit ./internal/service -run '^(TestBuildOpenAIAccountLoadRequestUsesRealConcurrency|TestAccountLoadPreferenceRateIsBoundedAndKeepsCapacitySeparate)$' -count=1 -v -timeout=5m) 2>&1 | tee "$RUNNER_TEMP/issue603-service-green.log"
          (cd backend && go test -tags=unit ./internal/repository -run '^TestListSchedulableAccountLoadsUsesSingleProjectionQuery$' -count=1 -v -timeout=5m) 2>&1 | tee "$RUNNER_TEMP/issue603-repository-green.log"
      - name: Compile production handler, repository and scheduler packages
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test -tags=unit ./internal/service ./internal/repository ./internal/handler ./internal/handler/admin ./internal/server/... -run '^$' -count=1 -timeout=15m) 2>&1 | tee "$RUNNER_TEMP/issue603-packages-compile.log"
      - name: Build production server package
        working-directory: backend
        run: go build -trimpath -o "$RUNNER_TEMP/sub2api" ./cmd/server
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue603-loadrate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue603-*.log
          if-no-files-found: error
          retention-days: 14
