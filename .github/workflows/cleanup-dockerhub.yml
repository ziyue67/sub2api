name: Cleanup DockerHub Tags

# 手动清理 Docker Hub 上 <DOCKERHUB_USERNAME>/sub2api 的镜像标签。
# 使用仓库现有 secrets（DOCKERHUB_USERNAME / DOCKERHUB_TOKEN），无需在本地暴露凭据。
# keep 留空 = 删除全部标签（用于镜像重建前清场）。
# 说明：Docker Hub tags 接口删除后会出现页码空洞（page=1 为空但 count>0），
#       因此按响应中的 next 链接逐页遍历，并按轮次重扫直到清空。

on:
  workflow_dispatch:
    inputs:
      keep:
        description: '要保留的 tag（逗号分隔；留空 = 删除全部）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete tags on Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          KEEP: ${{ inputs.keep }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time, urllib.request

          user = os.environ["DH_USER"]
          token = os.environ["DH_TOKEN"]
          keep = set(filter(None, os.environ.get("KEEP", "").replace(" ", "").split(",")))

          def http(url, method="GET", auth=None):
              req = urllib.request.Request(url, method=method)
              if auth:
                  req.add_header("Authorization", "JWT " + auth)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}

          login = urllib.request.Request(
              "https://hub.docker.com/v2/users/login",
              data=json.dumps({"username": user, "password": token}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(login, timeout=30) as resp:
              jwt = json.loads(resp.read()).get("token")
          if not jwt:
              raise SystemExit("Docker Hub 登录失败（检查 token 是否有效）")

          API = f"https://hub.docker.com/v2/repositories/{user}/sub2api/tags/"
          deleted = kept = failed = 0
          remaining = -1
          for rnd in range(1, 201):
              url = f"{API}?page=1&page_size=100"
              round_deleted = 0
              while url:
                  try:
                      data = http(url, auth=jwt)
                  except Exception as exc:
                      print("WARN fetch failed:", url, exc)
                      time.sleep(5)
                      break
                  for item in data.get("results", []):
                      name = item.get("name")
                      if not name:
                          continue
                      if name in keep:
                          kept += 1
                          print("keep ", name)
                          continue
                      try:
                          http(f"{API}{name}/", method="DELETE", auth=jwt)
                          deleted += 1
                          round_deleted += 1
                          print("del  ", name)
                          time.sleep(0.2)
                      except Exception as exc:
                          failed += 1
                          print("WARN delete failed:", name, exc)
                  url = data.get("next")
              remaining = http(f"{API}?page=1&page_size=1", auth=jwt).get("count", 0)
              print(f"round={rnd} round_deleted={round_deleted} remaining={remaining}")
              if remaining == 0:
                  break
              if round_deleted == 0:
                  print("no progress; stop")
                  break

          print(f"RESULT deleted={deleted} kept={kept} failed={failed} remaining={remaining}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("### DockerHub 清理结果\n")
                  fh.write(f"- 已删除: {deleted}\n")
                  fh.write(f"- 保留: {kept}\n")
                  fh.write(f"- 失败: {failed}\n")
                  fh.write(f"- 剩余 tag 数: {remaining}\n")
          PYEOF
