name: Quality ownership offline UI
on:
  push:
    branches: [fix/quality-template-switch-conflicts]
  pull_request:
    paths:
      - 'frontend/src/components/admin/operations/QualityOwnershipReview.vue'
      - '.github/scripts/quality-ownership-screenshot.mjs'
      - '.github/workflows/quality-ownership-ui.yml'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Install isolated screenshot tool
        run: |
          npm install --prefix "$RUNNER_TEMP/quality-browser" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/quality-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render actual component with offline fixtures
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/quality-browser/node_modules/playwright
          QUALITY_SCREENSHOT_DIR: ${{ runner.temp }}/quality-screenshots
        run: node .github/scripts/quality-ownership-screenshot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-ownership-ui-${{ github.sha }}
          path: ${{ runner.temp }}/quality-screenshots
          if-no-files-found: error
