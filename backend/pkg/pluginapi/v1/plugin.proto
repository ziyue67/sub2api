syntax = "proto3";

package sub2api.plugin.v1;

option go_package = "github.com/Wei-Shaw/sub2api/pkg/pluginapi/v1;pluginv1";

service TransportPlugin {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);
  rpc TestConfig(TestConfigRequest) returns (TestConfigResponse);
  rpc Forward(stream ForwardRequest) returns (stream ForwardResponse);
  rpc InitHostServices(InitHostServicesRequest) returns (InitHostServicesResponse);
  rpc NominateAccount(NominateAccountRequest) returns (NominateAccountResponse);
}

service HostService {
  rpc KVGet(KVGetRequest) returns (KVGetResponse);
  rpc KVSet(KVSetRequest) returns (KVSetResponse);
  rpc KVDelete(KVDeleteRequest) returns (KVDeleteResponse);
  rpc KVList(KVListRequest) returns (KVListResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc ResolveOutboundIdentity(ResolveOutboundIdentityRequest) returns (ResolveOutboundIdentityResponse);
}

message GetInfoRequest {}
message GetInfoResponse {
  string plugin_id = 1;
  string plugin_version = 2;
  uint32 protocol_version = 3;
  uint32 transport_api_version = 4;
  repeated string capabilities = 5;
  uint32 scheduling_api_version = 6;
}

message HealthRequest {}
message HealthResponse {
  bool healthy = 1;
  string message = 2;
  string status_json = 3;
}

message ValidateConfigRequest { bytes config_json = 1; }
message ValidateConfigResponse {
  bool valid = 1;
  string message = 2;
  bytes normalized_config_json = 3;
}

message ApplyConfigRequest { bytes config_json = 1; }
message ApplyConfigResponse {
  bool applied = 1;
  string message = 2;
}

message TestConfigRequest { bytes config_json = 1; }
message TestConfigResponse {
  bool success = 1;
  string message = 2;
  int64 latency_ms = 3;
  string status_json = 4;
}

message HeaderValues { repeated string values = 1; }

message ForwardRequestStart {
  string request_id = 1;
  string method = 2;
  string url = 3;
  string host = 4;
  map<string, HeaderValues> headers = 5;
  string proxy_url = 6;
  int64 account_id = 7;
  int32 account_concurrency = 8;
  string platform = 9;
  string account_type = 10;
  int64 content_length = 11;
  bool has_body = 12;
}

message ForwardRequest {
  oneof frame {
    ForwardRequestStart start = 1;
    bytes body_chunk = 2;
    bool body_end = 3;
  }
}

message ForwardResponseStart {
  int32 status_code = 1;
  string status = 2;
  string protocol = 3;
  int32 protocol_major = 4;
  int32 protocol_minor = 5;
  map<string, HeaderValues> headers = 6;
  int64 content_length = 7;
}

message ForwardResponseEnd {
  int64 bytes_received = 1;
  int64 duration_ms = 2;
}

message ForwardResponseError {
  string code = 1;
  string message = 2;
  bool request_sent = 3;
}

message ForwardResponse {
  oneof frame {
    ForwardResponseStart start = 1;
    bytes body_chunk = 2;
    ForwardResponseEnd end = 3;
    ForwardResponseError error = 4;
  }
}

message InitHostServicesRequest {
  uint32 host_service_id = 1;
  uint32 host_service_api_version = 2;
}

message InitHostServicesResponse {
  bool ready = 1;
  string message = 2;
}

message KVGetRequest {
  string namespace = 1;
  string key = 2;
}
message KVGetResponse {
  bool found = 1;
  bytes value = 2;
}
message KVSetRequest {
  string namespace = 1;
  string key = 2;
  bytes value = 3;
  int64 ttl_seconds = 4;
}
message KVSetResponse {}
message KVDeleteRequest {
  string namespace = 1;
  string key = 2;
}
message KVDeleteResponse {}
message KVListRequest {
  string namespace = 1;
  string key_prefix = 2;
  int32 limit = 3;
}
message KVListResponse { repeated string keys = 1; }

message ListAccountsRequest {
  string platform = 1;
  string account_type = 2;
}
message ListAccountsResponse {
  repeated int64 account_ids = 1;
  repeated AccountInfo accounts = 2;
}

message AccountInfo {
  int64  id = 1;
  string platform = 2;
  string account_type = 3;
  string name = 4;
  string status = 5;
  bool   schedulable = 6;
  bool   is_shadow = 7;
  bytes  metadata_json = 20;
}

message ResolveOutboundIdentityRequest { int64 account_id = 1; }
message ResolveOutboundIdentityResponse {
  bool found = 1;
  int64 account_id = 2;
  string platform = 3;
  string account_type = 4;
  string proxy_url = 5;
  string token = 6;
  map<string, HeaderValues> headers = 7;
}

// ---- Scheduling capability: openai.account.scheduling.v1 ----

// ScheduleCandidate is one host-eligible account the plugin may nominate.
// The host has already applied every hard gate (status, platform, group,
// transport, privacy, model capability, quota) before building this list, so
// every candidate is legal to pick. The plugin only expresses a preference.
message ScheduleCandidate {
  int64  account_id = 1;
  string account_type = 2;
  string name = 3;
  int32  priority = 4;
  // in_flight / max_concurrency come from the host's authoritative counters.
  int64  in_flight = 5;
  int64  max_concurrency = 6;
  int64  waiting_count = 7;
  double load_rate = 8;
  double error_rate = 9;
  double ttft_ms = 10;
  bool   has_ttft = 11;
  bool   is_subscription = 12;
  double upstream_rate = 13;
  bool   upstream_rate_known = 14;
}

message NominateAccountRequest {
  string request_id = 1;
  string platform = 2;
  // session_hash is the host's stable per-conversation key (derived from
  // session-id / conversation-id / prompt_cache_key). This is the affinity key.
  string session_hash = 3;
  string previous_response_id = 4;
  string requested_model = 5;
  int64  group_id = 6;
  bool   has_group = 7;
  int64  sticky_account_id = 8;
  int64  sticky_previous_account_id = 9;
  // candidates are the eligible accounts, already ranked by the host.
  repeated ScheduleCandidate candidates = 10;
}

message NominateAccountResponse {
  // handled=false means "host, keep your own ordering" (plugin has no opinion,
  // capability disabled, or it needs to fail open). The host then behaves
  // exactly as if no scheduling plugin were installed.
  bool   handled = 1;
  // nominated_account_id must be one of the candidate ids. 0 = no preference.
  int64  nominated_account_id = 2;
  // reason is a short, non-sensitive tag for observability.
  string reason = 3;
  // affinity_hit reports whether the nomination came from a sticky binding.
  bool   affinity_hit = 4;
}
